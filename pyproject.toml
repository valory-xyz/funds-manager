[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[project]
name = "funds-manager"
version = "0.1.0"
description = ""
requires-python = ">=3.10,<3.15"
readme = "README.md"
license = "Apache-2.0"
dependencies = [
    # OA / open-aea / plugins — pinned exactly (framework contract).
    "open-autonomy[all]==0.21.26",
    "open-aea-ledger-ethereum==2.2.9",
    "open-aea-ledger-cosmos==2.2.9",
    "open-aea-test-autonomy==0.21.26",
    "open-aea-cli-ipfs==2.2.9",
    "open-aea-helpers==0.21.26",
    # Framework/lib deps — ranges (funds-manager ships a skill library, not an app).
    "requests>=2.32.5",
    "grpcio==1.78.0",
    "asn1crypto<1.5.0,>=1.4.0",
    "protobuf>=5,<6",
    "hypothesis>=6",
    "ecdsa>=0.15",
    "pytest>=8,<10",
    "pytest-asyncio>=1.3",
    # Third-party YAML deps (declared in abstract_round_abci/http_client).
    "aiohttp<4.0.0,>=3.8.5",
    "certifi",
    "multidict",
    "py-ecc<10,>=8",
    # funds_manager skill runtime deps (actual imports in packages/).
    "web3<8,>=7.15.0",
    "w3multicall>=0.3.1",
    "pydantic>=2.11.9,<3",
    "eth-abi<6,>=5",
    "eth-utils<6,>=5",
    "pip>=24.0",
]

[project.urls]
Repository = "https://github.com/valory-xyz/funds-manager"

[dependency-groups]
dev = [
    "setuptools>=78.1.1,<82",
    "tomte[cli, tests] @ git+https://github.com/valory-xyz/tomte.git@v0.7.0",
]

[tool.uv]
default-groups = "all"
prerelease = "allow"

[tool.tomte]
# No non-PyPI upstream beyond OA/open-aea, which tomte auto-derives
# from `[project].dependencies`.
upstream_pins = []
# `funds_manager` is a utility skill (rebalancing helpers) with no
# `handlers.py` — it doesn't speak ABCI / HTTP / signing, so the
# canonical handler-presence check has nothing to lint here. Extend
# the auto-derived third-party ignores with this dev-package name.
check_handlers_ignores = ["funds_manager"]
tomte_dep_pin = " @ git+https://github.com/valory-xyz/tomte.git@v0.7.0"

[tool.uv.build-backend]
module-name = ["packages"]
module-root = ""
