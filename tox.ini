; Local extensions to tomte's canonical tox.ini. Consumed by `tomte tox`.

[tomte-extensions]
; Range-form overrides + extras applied to every tomte tox env (lint,
; type-check, test matrix, packaging, …):
;   - protobuf: pyproject pins `<6,>=5`; the open-aea protocol stack
;     declares the same range in its YAML. `aea-helpers
;     check-dependencies` does string-strict matching, so this entry
;     must echo the YAML form verbatim.
;   - werkzeug / attrs: not in [project].dependencies, but the lint-side
;     mypy stubs for flask/attrs need them present at import time.
extra_deps =
    protobuf<6,>=5
    werkzeug>=3.1,<4
    attrs>=25,<26

[pytest]
; Opt in to tomte's canonical pytest defaults (integration/e2e markers,
; aea.* DeprecationWarning filter). Plugin is silent without this flag so
; non-fleet `tomte[black]` consumers don't get unexpected config injection.
tomte_defaults = true
; anchorpy 0.20.2 (pulled transitively via open-aea-ledger-solana since
; open-autonomy 0.21.20) ships a pytest plugin with a broken import that
; crashes pytest collection. Disable its pytest11 entry point.
addopts = -p no:pytest_anchorpy
; Per-repo runtime knobs that tomte's canonical plugin doesn't ship:
; verbose CLI log capture (kept since the pre-migration tox.ini set it
; explicitly), and pinned strict asyncio mode (default in pytest-asyncio
; 1.x but stated explicitly so a future major bump can't silently flip
; it to auto).
log_cli = 1
log_cli_level = DEBUG
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S
asyncio_mode = strict

; Repo-specific overrides (third-party packages synced via IPFS, not
; lint-clean — these come from open-autonomy upstream).
[mypy-packages.valory.connections.*]
ignore_errors = True

[mypy-packages.valory.contracts.*]
ignore_errors = True
ignore_missing_imports = True

[mypy-packages.valory.protocols.*]
ignore_errors = True

[mypy-packages.valory.skills.abstract_abci.*]
ignore_errors = True

[mypy-packages.valory.skills.abstract_round_abci.*]
ignore_errors = True

; w3multicall + pydantic are pulled in by funds_manager skill code but
; aren't installed in tomte's canonical mypy testenv (which only has
; `pip + tomte[mypy,cli]`). Per-module `ignore_missing_imports = True`
; entries don't suppress the resulting `[import-not-found]` errors
; under mypy 1.19.x for the bare-package form, so the imports carry
; `# type: ignore[import-not-found]` markers in source. Disable
; `unused-ignore` warnings repo-wide so those markers don't trip the
; canonical `warn_unused_ignores = True` whenever mypy happens to
; find the libs (e.g. running mypy outside tomte tox in a venv that
; has them installed).
[mypy]
disable_error_code = unused-ignore


[Authorized Packages]
; open-autonomy wheel metadata reports "Other/Proprietary"; actual license is Apache-2.0.
open-autonomy: ==0.21.26
; anchorpy / based58 / jsonalias: transitive deps via open-aea-ledger-solana
; (added by open-autonomy 0.21.20). All three ship under MIT per their
; GitHub repos but expose no PyPI License field, so PARANOID liccheck
; reports them UNKNOWN.
anchorpy: 0.20.2
based58: 0.1.1
jsonalias: 0.1.1
; httpx: pulled in via solana << anchorpy. uv resolves a 1.0.dev* build
; under prerelease = "allow"; that build's metadata ships no License field.
; httpx is BSD-3-Clause upstream. liccheck parses this block with
; `semantic_version` (SemVer), not PEP 440 — the pre-release suffix
; here is `-dev` (SemVer), not `.dev0` (PEP 440); the canonical
; PEP 440 form is rejected with `ValueError: Invalid simple block`.
httpx: >=1.0.0-dev,<2
; cffi 2.1.1 reports MIT-0, more permissive than MIT but absent from authorized_licenses.
cffi: >=2.1,<3
